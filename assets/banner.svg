<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38bdf8;
    }
    .card-desc {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }

    /* Animated background elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes beamSweep {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(300px); opacity: 0; }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 300px;
    }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-float-4 { animation: floatPill 6.5s ease-in-out infinite 0.5s; }
    .pill-float-5 { animation: floatPill 4.8s ease-in-out infinite 1.5s; }
    
    .vector-beam {
      stroke-dasharray: 200 400;
      animation: beamSweep 6s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1150" y1="0" x2="1150" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Dynamic Animated Ambient Orbs (Background layer) -->
  <circle class="orb-1" cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="300" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle cx="600" cy="380" r="120" fill="#c084fc" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative dynamic vector search connection lines (stays in subtle background) -->
  <g fill="none" opacity="0.3">
    <path class="vector-beam" d="M 120 320 Q 350 200 600 290 T 1080 120" stroke="url(#primaryGrad)" stroke-width="2" />
    <path class="vector-beam" d="M 80 140 Q 400 350 750 180 T 1120 280" stroke="url(#accentGrad)" stroke-width="1.5" style="animation-duration: 9s;" />
  </g>

  <!-- Decorative Search Radar / Rings in right background -->
  <g transform="translate(1040, 180)" opacity="0.18">
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle r="80" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle r="125" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 6" />
    <circle r="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, fully readable, crisp layer -->

  <!-- Top Category Tag -->
  <g transform="translate(100, 58)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="30" y="19" class="pill-text" fill="#94a3b8" font-size="11" letter-spacing="1">CURATED REGISTRY</text>
  </g>

  <!-- Main Title with Gradient fill -->
  <text x="100" y="140" class="title" fill="url(#primaryGrad)">Awesome AI Search ⚡</text>

  <!-- Subtitle / Mission Statement -->
  <text x="100" y="185" class="subtitle">
    The Definitive Guide to Semantic Retrieval, Vector Engines, RAG &amp; Enterprise Neural Search
  </text>

  <!-- Dynamic Feature Badges / Capability Pills (Foreground interactive aesthetics) -->
  <g transform="translate(100, 230)">
    <!-- Pill 1 -->
    <g class="pill-float-1" transform="translate(0, 0)">
      <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
      <text x="22" y="24" class="pill-text">🧠 Semantic Search</text>
    </g>
    <!-- Pill 2 -->
    <g class="pill-float-2" transform="translate(170, 0)">
      <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="22" y="24" class="pill-text">⚡ Vector Databases</text>
    </g>
    <!-- Pill 3 -->
    <g class="pill-float-3" transform="translate(350, 0)">
      <rect width="145" height="38" rx="19" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="22" y="24" class="pill-text">📚 RAG Pipelines</text>
    </g>
    <!-- Pill 4 -->
    <g class="pill-float-4" transform="translate(510, 0)">
      <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="22" y="24" class="pill-text">🏢 Enterprise SaaS</text>
    </g>
    <!-- Pill 5 -->
    <g class="pill-float-5" transform="translate(680, 0)">
      <rect width="155" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="22" y="24" class="pill-text">🔓 Open Source</text>
    </g>
  </g>

  <!-- Bottom Spec Highlights Line -->
  <g transform="translate(100, 325)">
    <text x="0" y="0" class="pill-text" fill="#64748b">Verified Pricing</text>
    <circle cx="105" cy="-4" r="2.5" fill="#475569" />
    <text x="120" y="0" class="pill-text" fill="#64748b">Free Tier Thresholds</text>
    <circle cx="265" cy="-4" r="2.5" fill="#475569" />
    <text x="280" y="0" class="pill-text" fill="#64748b">Market Capitalization &amp; Valuation</text>
    <circle cx="510" cy="-4" r="2.5" fill="#475569" />
    <text x="525" y="0" class="pill-text" fill="#64748b">GitHub Stars Trajectory</text>
  </g>
</svg>
